semantics:
  predicate_notation: declarative_logic_not_current_evaluator_DSL
  mandatory_separator_meaning: Sufficient only within a rule set selecting this rule and after all proof gates pass; not normative adoption.
  truth_states: [proven_true, proven_false, data_unknown, model_unresolved]
  unknown_is_value: false
  not_proven_implies_compatible: false
  positive_certificate_overrides_unrelated_unknown: true
  hard_compatible_is_final_merge: false
  equality_requires_positive_complete_signature: true
  candidate_signature: [hard_decision_function_over_common_context_domain, normalized_admission_competence_structure_over_context_domain]
  terminal_precedence:
    - rule_conflict
    - must_separate
    - model_unresolved
    - data_unknown
    - hard_compatible
    - separation_not_proven
  evidence_consistency: Adding consistent evidence at fixed time and rule version preserves sufficient certificates; corrections or new versions may change them.
  minimality_claim: Two explicit sufficient certificate types; strict logical independence for every future S/H is not proved.
  construction_limit: Pairwise negative constraints alone need not determine a unique coarsest partition.
  geometry_limit: A witness supports certified disjoint homogeneous fragments, not every point of containing reference objects.

