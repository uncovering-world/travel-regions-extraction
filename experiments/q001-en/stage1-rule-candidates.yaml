rules:
  - id: CR-W
    name: proven_hard_territorial_decision_discontinuity
    status: proposed_sufficient
    selected_in_recommended_core: true
    mandatory_separator: true
    operational_definition_ref: stage1-rule-review.md#32-existential-witness-semantics
    predicate: exists C in S_v and d in H_v such that all gates hold and both territorial decisions are proved and unequal at the same t
    gate_refs: [G-SCOPE, G-CONTEXT, G-HARD, G-TIME, G-EVIDENCE]
    evidence_requirements:
      - Applicable class-based decision rules for both sides and their effective dates.
      - Nonempty matched traveller context and all relevant exemptions.
      - Specific unequal hard output, not merely different policy text or IDs.
      - Territorial legal effect, homogeneous certified scopes and standing-rule basis.
    hard_rationale: A single hard decision function cannot correctly represent both certified scopes.
    counterexamples:
      - Different discretionary officer events under one policy.
      - Different ports or carriers without territorial legal effect.
      - Site/activity permit, unverified access, weather closure, or advisory alone.
    intentionally_not_separated:
      - Complete equal hard decision functions under different institutions.
      - Legal-status, dependency, island or destination labels with no hard effect.
      - Out-of-scope traveller purposes and named individual exceptions.
    known_failure_modes:
      - Rare valid class may create a boundary; this is intentional within S, not suppressed by frequency.
      - Permit classification can remain Q005/Q009 model-unresolved.
      - Witness may prove only reference fragments, not whole overlapping endpoints.
      - Standing-versus-event gate is a proposed convention with Q008 limits.
    related_rules: [R007, R008, R012, R014, R015, R027, R028, R031, R038, R039]
    related_open_questions: [Q001, Q002, Q004, Q005, Q006, Q008, Q009]
    related_candidate_rules: [CR-J, CR-C, CR-P, CR-B]
    existing_comparison_refs: [C007, C018, C029, C030, C042]
    existing_evidence_refs: [E07, E08, E10, E19, E26, E28, E44]
    existing_outcome_revalidation: No candidate outcomes computed; current witness certificates need the new gates checked separately.

  - id: CR-J
    name: proven_independent_final_admission_competence_difference
    status: proposed_sufficient
    selected_in_recommended_core: true
    mandatory_separator: true
    operational_definition_ref: stage1-rule-review.md#42-operational-definition-independent_final_admission_jurisdiction
    predicate: all applicable gates and J1-J6 hold, and normalized territorial competence structures over the same S and t are proved unequal
    gate_refs: [G-SCOPE, G-CONTEXT, G-TIME, G-EVIDENCE]
    jurisdiction_premise_refs: [J1, J2, J3, J4, J5, J6]
    evidence_requirements:
      - Constitutive allocation and territorial admission/stay legal effects.
      - Reserved ordinary final decision powers and non-substitution proof.
      - Positive audit of attribution, delegation, required assent, override, review and leave recognition.
      - Effective application; independent civilian operational corroboration for de facto arrangements.
      - Evidence of differing capacities or assent structures on the two certified scopes.
    hard_rationale: The proposed institutional invariant forbids hiding different independent final territorial admission responsibilities in one Stage 1 cell.
    counterexamples:
      - Different local immigration offices within one substitutable national admission chain.
      - Separate permit issuer without proof of final territorial competence.
      - Different military patrols or civil administrators without admission capacity.
    intentionally_not_separated:
      - Different legal-status labels with one admission competence and otherwise equal hard decisions.
      - Office districts, stamps, visa processing contractors and administrative autonomy alone.
    known_failure_modes:
      - Documentary extraction requires auditable legal interpretation; no automatic natural-language oracle is supplied.
      - Independent capacities with equal policies are deliberately split by normative choice, not empirical necessity.
      - Shared competence can remain unresolved; ultimate sovereignty and ordinary case substitution must not be confused.
      - Existing independent_admission_jurisdiction booleans do not entail every stricter premise.
    related_rules: [R008, R011, R018, R023, R024, R038, R039]
    related_open_questions: [Q001, Q006, Q007, Q008]
    related_candidate_rules: [CR-W, CR-C, CR-I]
    existing_comparison_refs: [C001, C007, C008, C009, C012]
    existing_evidence_refs: [E02, E03, E18, E20, E21, E23]
    existing_outcome_revalidation: Current P2 counts are preserved as historical outputs; all J1-J6 premises require a separate audit, especially E23 non-substitution.

  - id: CR-C
    name: stable_distinct_control_as_independent_separator
    status: rejected_as_independent_rule_at_present
    selected_in_recommended_core: false
    mandatory_separator: false
    predicate: null
    considered_predicate: stable actual controller or civilian access/control system differs
    evidence_requirements:
      - Civil, military, border and enforcement roles must be decomposed by scope and time.
      - Any claimed independent hard effect must be defined beyond controller identity.
    hard_rationale: No independent hard rationale remains defined beyond qualifying CR-W consequences or CR-J capacities.
    counterexamples: [different_patrol_same_admission_system, different_municipality_same_competence, military_position_without_civilian_regime]
    intentionally_not_separated: [control_actor_label_alone, mine_hazard_alone, unverified_civilian_access]
    known_failure_modes: [duplicates_CR-W_or_CR-J, military_or_administrative_over_splitting, undefined_stability, claim_geometry_substitution]
    related_rules: [R015, R024, R028, R030, R039]
    related_open_questions: [Q005, Q006, Q007, Q008, Q009]
    related_candidate_rules: [CR-W, CR-J]
    existing_comparison_refs: [C032, C040, C043, C044, C045, C046, C047, C049]
    existing_evidence_refs: [E37, E38, E41, E50, E51, E52, E53, E54, E55]

  - id: CR-I
    name: territorial_legal_identity
    status: rejected_for_production_undefined
    selected_in_recommended_core: false
    mandatory_separator: false
    predicate: null
    evidence_requirements:
      - A new exact general predicate and its normative travel rationale would be needed before admission to any production profile.
      - Neither internal nor external curated place membership may substitute for the missing predicate.
    hard_rationale: None established independently of admission competence or specific legal consequences.
    counterexamples: [municipal_legal_personality, ordinary_province_own_laws, autonomous_region_without_admission_power]
    intentionally_not_separated: [ISO_code_exists, autonomous_true, disputed_true, dependent_territory_true, historically_separate_label]
    known_failure_modes: [hidden_politically_salient_place_list, recognition_bias, administrative_over_splitting, circular_identity_definition, destination_leakage]
    related_rules: [R010, R016, R018, R019, R038, R042]
    related_open_questions: [Q001, Q001.identity, Q006, Q011]
    related_candidate_rules: [CR-J, CR-L, CR-D]

  - id: CR-D
    name: disputed_status_flag
    status: rejected_as_sufficient
    selected_in_recommended_core: false
    mandatory_separator: false
    predicate: disputed(A) != disputed(B)
    evidence_requirements: [Evidence that a claim exists proves only that a claim exists.]
    hard_rationale: No hard admission or access consequence follows from the flag.
    counterexamples: [new_unenforced_claim_with_unchanged_decisions_and_competence]
    intentionally_not_separated: [claim_or_recognition_change_alone]
    known_failure_modes: [claim_blindness_violation, hidden_claim_significance_threshold, claimant_polygon_as_operational_geometry]
    related_rules: [R016, R022, R024]
    related_open_questions: [Q006]
    related_candidate_rules: [CR-I, CR-L]

  - id: CR-L
    name: explicit_international_legal_status_separator
    status: deferred_no_adoptable_predicate
    selected_in_recommended_core: false
    mandatory_separator: false
    predicate: null
    evidence_requirements:
      - An explicit general legal-status predicate with specified competent instruments, applicability and territorial effect or separately justified status-preservation purpose.
      - Universal inclusion and exclusion semantics independent of names, recognition counts and curated place membership.
      - Operational scope rather than automatic claimant polygon assignment.
    hard_rationale: No status-only hard rationale adopted; independently applicable travel consequences already belong to CR-W.
    counterexamples: [external_decolonization_registry_as_universal_dispute_definition, any_claim_as_legal_status, full_operational_equality_without_new_predicate]
    intentionally_not_separated: [status_label_alone_under_candidate_core]
    known_failure_modes: [external_curated_registry, recognition_source_selection_bias, incomplete_class_coverage, overlap, D007_not_guaranteed_by_core]
    related_rules: [R010, R022, R024, R042]
    related_open_questions: [Q006, Q011]
    related_candidate_rules: [CR-W, CR-I, CR-D]
    existing_comparison_refs: [C031, C033, C034, C040]
    existing_evidence_refs: [E36, E37, E39, E40, E50]

  - id: CR-P
    name: any_mandatory_permit
    status: rejected_as_blanket_rule
    selected_in_recommended_core: false
    mandatory_separator: false
    predicate: permit_requirement(A,C) != permit_requirement(B,C)
    evidence_requirements: [Permit existence alone is insufficient; territorial admission or presence effect must pass G-HARD for CR-W.]
    hard_rationale: Only an accepted territorial legal effect is hard; generic permit existence is not.
    counterexamples: [museum_ticket, trekking_activity_permit, landing_facility_permission, ambiguous_park_access_rule]
    intentionally_not_separated: [site_or_activity_permission_alone, whole_administrative_scope_label_alone]
