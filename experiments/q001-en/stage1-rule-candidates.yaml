invariants:
  - id: INV-NAME
    transformation: Consistently rename territories, authorities and all related IDs while preserving facts and relationships.
    expected: Isomorphic outcome and certificate structure.
  - id: INV-CLAIM
    transformation: Change claim or recognition labels only; keep independently applicable D and J unchanged.
    expected: No outcome change; a new applicable legal obligation is a different input change.
  - id: INV-DESTINATION
    transformation: Change destination popularity or identity only.
    expected: No new Stage 1 certificate.
  - id: INV-ISLAND
    transformation: Change island or remote label without altering hard effects or scopes of competence.
    expected: No new Stage 1 certificate; hard-compatible geometry may be MultiPolygon.
  - id: INV-ADMIN
    transformation: Add a province label, service district or local office with no independent competence or decision discontinuity.
    expected: No new Stage 1 certificate.
  - id: INV-OPEN
    transformation: Remove a required proof or replace complete coverage evidence with sampled matches.
    expected: Unknown or incomplete signature; no equality or split inferred from absence.
  - id: INV-REFINEMENT
    transformation: Propose a later cell crossing a proved Stage 1 separator in the same release.
    expected: Invalid refinement.
  - id: INV-ORDER
    transformation: Permute input order or swap comparison endpoints.
    expected: Same semantic result; oriented witness fields swap consistently.

normative_experiment_contract:
  synthetic: true
  geographic_assertions: false
  implemented_as_current_evaluator_fixtures: false
  executed_by_this_artifact: false
  oracle_basis: Explicit proposed predicates and proof assumptions, never desired real-region names.
  consistency_gate: Prove each bundle coherent under exact S/H, including leave validity, refusal history and recognition; if J difference entails an included D difference, reject asserted complete D equality.
  expected_outcomes_conditional_on_consistency_gate: true
  equal_D_different_J_real_pair_proved: false
  defaults:
    context: coherent_class_based_civilian_short_stay
    scopes: nonempty_disjoint_with_homogeneous_certified_effects
    time: same_fixed_t_with_standing_rules_effective
    evidence: complete_consistent_premise_proofs_except_explicitly_missing
    decision_coverage: complete_except_explicitly_unknown
    jurisdiction_coverage: complete_except_explicitly_unknown
  comparator: witness-only-strict-v1
  recommended: candidate-core-v1
  required_transformations: [INV-NAME, INV-ORDER]
  acceptance_criteria:
    - Decide explicitly whether NX-01 independent responsibility should be hard even when all D outputs equal.
    - Explain NX-01 versus NX-02 using the same J1-J6 definition under name and type-label swaps.
    - Preserve NX-04 distinction between shared apex/processor and shared admission capacity.
    - If NX-05 or NX-06 must split, publish a separate general hard predicate; do not insert expected place outcomes.
    - Preserve data/model unknown in NX-07 and NX-08.
  optional_existing_evidence_audit:
    evidence_refs: [E02, E03, E18, E20, E21, E23]
    premise_refs: [J1, J2, J3, J4, J5, J6]
    cells: [entailed, not_entailed, unknown]
    new_geographic_research_required: false
    preserving_existing_split_counts_required: false

normative_experiments:
  - id: NX-01
    name: equal_decisions_independent_capacities
    facts:
      decision_functions: complete_equal
      competence_structures: proved_different
      territorial_titles: separate
      reserved_powers: independently_final
      ordinary_cross_capacity_substitution: proved_absent
      J1_J6: all_proved
    expected_comparator: hard_compatible
    expected_candidate: must_separate
    applied_candidate_rules: [CR-J]
    normative_choice: Tests the additional institutional invariant, not a factual visa difference.
  - id: NX-02
    name: different_offices_one_competence
    facts:
      decision_functions: complete_equal
      competence_structures: complete_equal
      office_holders: different
      service_districts: different
      territorial_admission_title: single
      ordinary_case_substitution: same_chain
    expected_comparator: hard_compatible
    expected_candidate: hard_compatible
    applied_candidate_rules: []
    normative_choice: Office and district inequality are not jurisdiction inequality.
  - id: NX-03
    name: one_capacity_different_territorial_visa_rule
    facts:
      decision_functions: proved_unequal_by_matched_visa_witness
      competence_structures: complete_equal
      territorial_effect: proved
      rule_kind: standing
    expected_comparator: must_separate
    expected_candidate: must_separate
    applied_candidate_rules: [CR-W]
    normative_choice: J is not necessary for a hard travel-decision boundary.
  - id: NX-04
    name: independent_capacities_shared_apex_and_processor
    facts:
      decision_functions: complete_equal
      competence_structures: proved_different
      J1_J6: all_proved
      apex_court: shared
      visa_processor: shared
      ultimate_legislator: may_amend_constitutive_instrument
      ordinary_cross_capacity_substitution: proved_absent
    expected_comparator: hard_compatible
    expected_candidate: must_separate
    applied_candidate_rules: [CR-J]
    normative_choice: Review or future legislative power is not ordinary substitution of admission capacity.
  - id: NX-05
    name: status_and_claim_only_difference
    facts:
      decision_functions: complete_equal
      competence_structures: complete_equal
      legal_status_labels: different
      claim_labels: different
      independently_applicable_legal_travel_consequences: complete_equal
    expected_comparator: hard_compatible
    expected_candidate: hard_compatible
    applied_candidate_rules: []
    normative_choice: A contrary mandatory product constraint exposes Q006; this synthetic case does not assert equality for any real disputed territory.
  - id: NX-06
    name: military_patrol_actor_only_difference
    facts:
      decision_functions: complete_equal
      competence_structures: complete_equal
      military_patrol_actor: different
      civilian_admission_and_presence_effect: complete_equal
    expected_comparator: hard_compatible
    expected_candidate: hard_compatible
    applied_candidate_rules: []
    normative_choice: Raw control actor identity is not a third hard dimension.
  - id: NX-07
    name: missing_non_substitution_proof
    facts:
      decision_functions: complete_equal
      competence_structures: data_unknown
      J4: missing_evidence
      J1_J2_J3_J5_J6: otherwise_proved_to_the_extent_independent_of_J4
    expected_comparator: hard_compatible
    expected_candidate: data_unknown
    applied_candidate_rules: []
    blocker_refs: [J4]
    normative_choice: A local authority assertion does not fill a missing institutional premise.
  - id: NX-08
    name: unresolved_territorial_or_site_permit
    facts:
      decision_functions: model_unresolved
      competence_structures: complete_equal
      permit_difference: proved
      regulated_act_classification: unresolved_territorial_presence_vs_site_access
    expected_comparator: model_unresolved
    expected_candidate: model_unresolved
    applied_candidate_rules: []
    blocker_refs: [Q005, Q009]
    normative_choice: Permit existence cannot resolve its own hard classification.
  - id: NX-09
    name: rare_class_standing_document_discontinuity
    facts:
      decision_functions: proved_unequal_by_matched_document_witness
      competence_structures: complete_equal
      actual_class_members: 1
      class_uses_named_person_ID: false
      context_within_scope: true
      territorial_effect: proved
      rule_kind: standing
    expected_comparator: must_separate
    expected_candidate: must_separate
    applied_candidate_rules: [CR-W]
    normative_choice: Valid hard difference remains sufficient regardless of class frequency.
  - id: NX-10
    name: incident_closure_outside_standing_core
    facts:
      decision_functions: complete_equal_on_core_outputs
      competence_structures: complete_equal
      additional_access_measure: event_specific_temporary_closure
      measure_kind: proved_incident_order
    expected_comparator: hard_compatible
    expected_candidate: hard_compatible
    applied_candidate_rules: []
    normative_choice: Proposed G-TIME excludes the incident measure from the core; access overlay still applies and full travel conditions are not claimed equal.
