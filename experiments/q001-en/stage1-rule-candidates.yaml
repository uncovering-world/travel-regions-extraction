gates:
  - id: G-SCOPE
    requires:
      - Nonempty disjoint certified scopes or explicit disjoint fragments of reference objects.
      - Claimed hard effect or competence is evidenced throughout each certified fragment.
      - Boundary follows legal or operational scope; administrative proxy requires justification and precision.
    unknown_effect: No invented full-area certificate or exact geometry.
  - id: G-CONTEXT
    requires:
      - One versioned context scope applied to every comparison.
      - Coherent nonempty civilian class with all decision-relevant attributes and exceptions evaluated.
      - Matched logical trip context; denial is an admissible response on either side.
    unknown_effect: Missing context evidence blocks the certificate; undefined scope is a model blocker.
  - id: G-HARD
    requires:
      - Difference belongs to an explicitly included hard output.
      - Regulated act has territorial entry or civilian presence/stay legal effect.
      - Effect is not inferred from issuer identity, object size, popularity, or coverage of a whole administrative unit.
    unknown_effect: Ambiguous territorial versus site/activity scope is Q005/Q009 model_unresolved.
  - id: G-TIME
    requires:
      - Constitutive or standing class-based instrument is effective at comparison time.
      - Rule is not activated solely by a particular incident, emergency, or event order.
      - Observation, retrieval, effective dates and uncertainty remain separate.
    duration_threshold: null
    future_persistence_required: false
    normative_sunset_automatically_excluded: false
    prolonged_emergency_automatically_standing: false
    unknown_effect: No age-based promotion; undefined classification remains Q008/Q007.
  - id: G-EVIDENCE
    requires:
      - Each premise has source reference, locator or excerpt, source competence, temporal and territorial scope.
      - Both sides of the asserted difference are proved, including applicable exceptions.
      - Source statements are not promoted beyond their actual entailment or verification status.
      - Material conflicts and uncertainty are explicit; positive allocation audit supports negative competence assertions.
    unknown_effect: Missing proof or source conflict does not become equality or a split.

jurisdiction_definition:
  id: independent-final-admission-competence-v1
  semantic_object: legal_capacity_with_territorial_effect_not_office_or_sovereign_label
  final_meaning: Ordinary administrative admission/stay competence under the current constitutive arrangement, not absence of judicial review or ultimate legislative authority.
  legal_order_meaning: Evidenced operative normative order; this does not adjudicate internationally lawful sovereignty.
  independent_meaning: Reserved territorial decision capacity not ordinarily substitutable by another admission capacity acting for its own territory.
  independent_legislature_required: false
  absence_of_parent_legislative_power_required: false
  unlimited_discretion_required: false
  actual_divergent_decision_required: false
  recognition_threshold: null
  holder_must_be_located_in_scope: false
  normalization:
    relation_types: [acts_for, case_substitution, required_assent, judicial_review, recognises_leave]
    collapse: Execution agents acting for one capacity share that capacity; normalize attribution before comparing.
    distinguish: A shared holder can exercise multiple capacities; a shared court or visa processor is not capacity equality.
    joint_arrangements: Compare the full capacity and veto/assent structure; do not assign a cell per actor.
    equality: Invariant under consistent bijective relabeling of all capacities and evidence locators.
    inequality: A proved reserved capacity has territorial effect on one scope and not the other, or an evidenced required-assent structure differs.
  premises:
    - id: J1
      field: constitutive_allocation
      requires: Effective normative clauses allocate ordinary civilian admission/refusal and stay conditioning or termination to a specified capacity, holder and competence chain.
    - id: J2
      field: territorial_legal_effect
      requires: Decision creates or ends territorial entry/stay permission or refusal; scope is not merely office district, processing port, facility, service or activity.
    - id: J3
      field: reserved_ordinary_competence
      requires: For at least one nonempty class-based civilian matter the capacity can decide finally without necessary individual assent of another capacity; territorial refusal or stay-termination power is documented.
    - id: J4
      field: non_substitution
      requires: Another capacity's leave for its own territory cannot itself decide for this scope or override its reserved territorial refusal; ordinary case substitution and recognition exceptions are audited.
    - id: J5
      field: attribution_delegation_review_closure
      requires: Relevant acts-for, substitution, assent, review and leave-recognition relations are evidenced; implementation delegation is collapsed, constitutive transfer is distinguished from ordinary supervision.
    - id: J6
      field: effective_territorial_application
      requires: Allocation applies in the scope at t; de facto orders additionally require independent civilian admission/enforcement corroboration, not only claims or military observations.
  sufficiency_not_exhaustiveness: true
  separation_proof_scope: J1-J6 cover the separating capacity and all relations affecting its independence or scope; unrelated incomplete dimensions do not cancel a sufficient certificate.
  compatibility_proof_scope: Complete coverage and equality of both competence structures is required, not merely absence of a separating certificate.
  unresolved_shared_arrangement_policy: Retain unknown or Q007 model blocker; do not fall back to country labels.

