[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctr-evaluator"
version = "0.1.0"
description = "Deterministic reference pairwise evaluator for Canonical Travel Regions"
requires-python = ">=3.11"

[project.scripts]
ctr-evaluator = "ctr_evaluator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
